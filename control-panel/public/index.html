<html>
  <head>
    <title>Robot - Control Panel</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div style="display: flex;">
      <div>
        <div class="input-grp">
          <p>Calibrate white:</p>
          <div>
            <input type="color" id="white" name="white" value="rgb(200, 200, 200)" />
            <label for="white">White <span id="white-precision-value">0</span> </label>
          </div>
          <input name="white-precision" id="white-precision" type="range" min="0" max="100" />
        </div>
      </div>
      <div>
        <div class="input-grp">
          <p>Calibrate orange:</p>
          <div>
            <input type="color" id="orange" name="orange" value="rgb(190, 100, 140)" />
            <label for="orange">Orange: <span id="orange-precision-value">0</span> </label>
          </div>
          <div>
            <input name="orange-precision" id="orange-precision" type="range" min="0" max="100" />
          </div>
        </div>
      </div>
      <div>
        <div class="input-grp">
          <p>Calibrate Red:</p>
          <div>
            <input type="color" id="red" name="red" value="rgb(190, 100, 140)" />
            <label for="red">red: <span id="red-precision-value">0</span> </label>
          </div>
          <div>
            <input name="red-precision" id="red-precision" type="range" min="0" max="100" />
          </div>
        </div>
      </div>
    </div>

    <input id="filename" value="14.png" type="text" />
    <button onclick="reset()">Reset</button>
    <button onclick="save_calibration_values()">Save</button>
    <button onclick="load_calibration_values()">Load</button>
    <button onclick="go()"> Go </button>

    <br />
    <br />

    <img width="900" alt="billede" />

    <script>
      function save_calibration_values(prefix = "tmp") {
        let ids_to_save = ["filename", "white", "white-precision", "orange", "orange-precision", "red", "red-precision"];
        let values = {};
        for (const id of ids_to_save) {
          let elem = document.getElementById(id);
          elem ? (values[id] = elem.value) : console.error(`No value for ${id}`);
        }
        localStorage.setItem(prefix + "_saved_values", JSON.stringify(values));

        go();
      }

      function load_calibration_values(prefix = "tmp") {
        let colors = localStorage.getItem(prefix + "_saved_values");
        if (colors) {
          colors = JSON.parse(colors);
          for (const [id, value] of Object.entries(colors)) {
            document.getElementById(id).value = value;
            let label = document.getElementById(`${id}-value`);
            if (label) {
              label.textContent = value;
            }
          }
        }

        go();
      }

      function change_precision_input(id, precision) {
        document.getElementById(id + "-precision-value").textContent = precision;
        save_calibration_values();
      }

      document.getElementById("white-precision").addEventListener("input", e => change_precision_input("white", e.target.value));
      document.getElementById("orange-precision").addEventListener("input", e => change_precision_input("orange", e.target.value));
      document.getElementById("red-precision").addEventListener("input", e => change_precision_input("red", e.target.value));

      document.getElementById('white').addEventListener('input', () => save_calibration_values());
      document.getElementById('orange').addEventListener('input', () => save_calibration_values());
      document.getElementById('red').addEventListener('input', () => save_calibration_values());

      let deb = false;
      let awaiting = false;

      function go() {
        if (deb) {
          if (!awaiting) {
            awaiting = true;
            setTimeout(() => {
              awaiting = false;
              go();
            }, 100);
          }
          return;
        }
        deb = true;
        setTimeout(() => {
          deb = false;
        }, 400);

        _go();
      }

      async function _go() {
        let values = localStorage.getItem("tmp_saved_values") || localStorage.getItem("ic_saved_values");
        if (!values) {
          console.error("No calibration values loaded yet!");
          return;
        }
        values = JSON.parse(values);

        let { filename, white, orange, red } = values;
        white = white.split('#')[1];
        orange = orange.split('#')[1];
        red = red.split('#')[1];


        let res = await fetch(`/obstacles?filename=${filename}&white=${white}&orange=${orange}&red=${red}&wp=${values["white-precision"]}&op=${values["orange-precision"]}&rp=${values["red-precision"]}`);

        let balls_res = await fetch(`/balls?filename=${filename}`);

        let img = await fetch("/latest.png");

        img.blob().then((blob) => {
          let url = URL.createObjectURL(blob);
          document.querySelector("img").src = url;
        });
      }

      function hex_to_rgb(hex) {
        return {
          r: parseInt(hex.slice(1, 3), 16),
          g: parseInt(hex.slice(3, 5), 16),
          b: parseInt(hex.slice(5, 7), 16),
        };
      }

      function reset() {
        localStorage.clear();
        localStorage.setItem(
          "ic_saved_values",
          JSON.stringify({ filename: "14.jpg", white: "#c8c8c8", "white-precision": "10", orange: "#be648c", "orange-precision": "10" }),
        );
        load_calibration_values("ic");
      }

      load_calibration_values();
    </script>
  </body>
</html>
